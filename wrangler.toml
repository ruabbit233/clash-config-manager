name = "clash-config-manager"
main = "src/index.ts"
compatibility_date = "2026-04-27"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./admin/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[build]
command = "npm run build"

[[kv_namespaces]]
binding = "KV"